# =============================================================
#  TikTok Shrine Live - ไฟล์ตั้งค่า (แก้แล้วปิด-เปิดโปรแกรมใหม่)
# =============================================================

[theme]
# โหมด/ธีม: "shrine" = ไหว้พระขอเลข / เสี่ยงเซียมซี,  "krathong" = ลอยกระทง,  "cat" = ให้อาหารแมว,  "dance" = โหมดเต้น,  "dunk" = ปาตกน้ำ
mode = "shrine"

[tiktok]
# ชื่อผู้ใช้ TikTok ของคุณ (ไม่ต้องใส่ @) เว้นว่าง = ไม่เชื่อมต่อ TikTok (ใช้คีย์บอร์ด/HTTP ทดสอบได้)
username = ""
# เปิดตัวเชื่อม (Node.js bridge) อัตโนมัติ
enabled = true
# ขั้นสูง: ตำแหน่ง Node.js เอง ("" = อัตโนมัติ: ใช้ตัวที่มากับโปรแกรม ไม่ต้องติดตั้งอะไรเพิ่ม)
node_command = ""
bridge_script = ""
# API key ของ EulerStream (ไม่บังคับ แต่ช่วยให้เชื่อมต่อเสถียรขึ้น) https://www.eulerstream.com
sign_api_key = ""
# ถ้าหลุด รอกี่วินาทีแล้วต่อใหม่
reconnect_seconds = 15
# ของขวัญที่ไม่ได้อยู่ในตาราง [gifts] ให้ทำอะไร: "pray" | "siamsi" | "none"
default_action = "pray"
# ส่งของขวัญเป็น combo x10 ให้เล่นซ้ำสูงสุดกี่รอบ (มูลค่ารวมยังนับครบสำหรับระดับความหรูหรา)
max_plays_per_gift = 1

# ---- จับคู่ของขวัญ -> การกระทำ ----
# คีย์ได้ทั้งชื่อของขวัญ (ภาษาอังกฤษตามที่ TikTok ส่งมา ไม่สนตัวพิมพ์เล็กใหญ่) หรือ gift id (ตัวเลข) เช่น
#   "Rose" / "5655" = กุหลาบ,  "TikTok" / "5269"
# ค่าเป็น "pray" | "siamsi" | "none"  (ความหมายตามโหมด — ดู docs/คู่มือ.md ข้อ 6)
# ในหน้าตั้งค่าแท็บของขวัญมีตัวเลือกสติกเกอร์ทั้งชุด (รูป ชื่อ รหัส ราคาเพชร) ให้คลิกเลือกได้ ไม่ต้องพิมพ์เอง
# ตารางครบชุด: docs/รายการของขวัญ.md
#   "pray"   = เดินไปไหว้พระ แล้วขึ้นเลขมงคล   (โหมดกระทง = ลอยกระทงขอเลข, โหมดแมว = ให้อาหารแล้วการ์ดขอบคุณ)
#   "siamsi" = เขย่าเซียมซี                  (โหมดกระทง = อธิษฐานรับคำอวยพร, โหมดแมว = การ์ดขอบคุณเหมือนกัน)
[gifts]
# อัตราบาทต่อเหรียญสำหรับคอลัมน์ "ราคา (บาท)" ในหน้าตั้งค่า (ราคาโดยประมาณ)
# ค่าเริ่มต้นคิดจากแพ็กเกจเว็บทางการ: 30 เหรียญ = 11 บาท
#   แหล่งที่มา: บทความ KTC (สถาบันการเงินไทย)
#   https://www.ktc.co.th/article/knowledge/tips/top-up-tiktok-coins-via-credit-card
#   เผยแพร่ 20 พ.ค. 2026, แก้ไขล่าสุดตาม JSON-LD 4 มิ.ย. 2026 13:35 น. เวลาไทย
# ราคาในแอปสูงกว่าเว็บ (บทความเดียวกัน: iOS 21 เหรียญ = 15 บาท) เพราะมีค่าธรรมเนียมร้านแอป
# ไม่ใช่ราคาจากหน้า tiktok.com/coin โดยตรง — หน้าดังกล่าวโหลดจากสภาพแวดล้อมนีไม่ได้ (ถูกบล็อก)
# ตั้งเป็น 0 ถ้าไม่ต้องการแสดงราคาบาท  หรือแก้ตัวเลขได้ในหน้าตั้งค่า
thb_per_coin = 0.3666666667
thb_rate_source = "แพ็กเกจเว็บทางการ TikTok 30 เหรียญ = 11 บาท ตามบทความ KTC"
thb_rate_date = "2026-06-04"
"Rose" = "pray"
"5655" = "pray"          # Rose (gift id)
"TikTok" = "siamsi"
"5269" = "siamsi"        # TikTok (gift id)
"Finger Heart" = "siamsi"   # 5487, 5 เพชร
"Doughnut" = "pray"         # 5879, 30 เพชร
"Perfume" = "siamsi"        # 5658, 20 เพชร
"Hand Heart" = "pray"       # 5660, 100 เพชร (ชื่อในแคตตาล็อกจริง ไม่ใช่ Hand Hearts)
"5660" = "pray"             # Hand Heart (gift id)
# ของแพงกว่า (Galaxy, Lion, TikTok Universe) ไม่ใส่ในค่าเริ่มต้น — เพิ่มเองได้ในแท็บของขวัญ

[http]
# เซิร์ฟเวอร์ภายในเครื่อง สำหรับทดสอบ / รับ webhook จาก TikFinity, Streamer.bot ฯลฯ
enabled = true
bind = "127.0.0.1:8787"

[window]
# ความกว้างหน้าต่าง (px) ความสูงคำนวณจากจอแนวตั้ง 9:16
width = 540
# "top" = ใช้ส่วนบนของจอ (สูง top_percent % ของจอ 9:16), "full" = เต็มจอ 9:16
layout = "top"
# 50 = ครึ่งจอบน (540 x 480)
top_percent = 50
# ตำแหน่งเริ่มต้นบนจอ (ลบออกได้)
x = 100
y = 60
# "transparent" = พื้นหลังใส (ลอยทับหน้าจอ)
# "green"       = พื้นเขียว #00FF00 สำหรับ Chroma Key
# "scene"       = วาดฉากวัดเต็มพื้นหลัง
background = "transparent"
always_on_top = true
# คลิกทะลุหน้าต่าง (กด F8 สลับ ตอนหน้าต่างโฟกัสอยู่ หรือเรียก http://127.0.0.1:8787/control?click_through=toggle)
click_through = false
# แสดงคำแนะนำการส่งของขวัญด้านล่าง
show_hint = true
hint_text = "ส่ง กุหลาบ = ไหว้พระขอเลข   |   ส่ง TikTok = เสี่ยงเซียมซี"
# แสดงสถานะการเชื่อมต่อมุมจอ
show_status = true
# ตอนว่าง (ไม่มีของขวัญ): "still" = ภาพนิ่งสวย ๆ ไม่มีตัวละคร (ค่าเริ่มต้น)
#                         "ambient" = ขยับเบา ๆ (เปลวเทียน ควันธูป กลีบดอกไม้)
#                         "hidden" = ซ่อนทั้งหมด (โปร่งใส) แล้วค่อยโผล่เมื่อมีของขวัญ
idle = "still"
# จำนวนตัวละครที่เห็นบนจอพร้อมกัน (คนที่กำลังไหว้ + คนที่ยืนต่อแถว) ที่เหลือรอนอกจอ
max_visible = 5

[numbers]
# จำนวนหลักของเลขมงคลที่จะสุ่ม (ใส่ได้หลายชุด เช่น [2, 3] หรือ [2, 3, 4])
digits = [2, 3]
title = "เลขมงคล"

[timing]
# ความเร็วการเล่น 1.0 = ปกติ, 1.5 = เร็วขึ้น
speed = 1.0
# เวลาแสดงผลเลข/คำทำนาย (วินาที)
reveal_seconds = 5.0

# ---- เรทราคา (ใช้ทุกโหมด: ไหว้พระ เซียมซี กระทง แมว เต้น ปาตกน้ำ) ----
# ขั้นเริ่มต้นใช้ของไม่แพงในแคตตาล็อกเท่านั้น (ทุกชิ้นไม่เกิน 100 เพชร):
#   Rose / TikTok = 1, Finger Heart = 5, Perfume = 20, Doughnut = 30, Hand Heart = 100
# ขั้น 5 และสตาร์ (tier5_auto + star_mode = auto) = ของที่แพงสุดในตารางจับคู่หรือแพงกว่า
# ค่าเริ่มต้นคือ Hand Heart = 100 เพชร (เพิ่มของแพงกว่าในแท็บของขวัญได้ ถ้าอยากยกระดับสตาร์)
# บันไดขั้น: 1 = ขั้น 1, 5 = ขั้น 2, 20 = ขั้น 3, 30 = ขั้น 4 (ขึ้นเวที), 100 = ขั้น 5 (สตาร์)
[[tiers]]
min_diamonds = 0
name = "สายบุญ"
[[tiers]]
min_diamonds = 5
name = "ผู้มีบุญ"
[[tiers]]
min_diamonds = 20
name = "เศรษฐีใจบุญ"
[[tiers]]
min_diamonds = 30
name = "มหาเศรษฐี"
[[tiers]]
min_diamonds = 100
name = "จักรพรรดิแห่งบุญ"

[rates]
# เพชรขั้นต่ำที่ขึ้นเวทีในฉาก «ฟลอร์ + เวที» (ค่าเริ่มต้น 30 = Doughnut — ของไม่แพง ขึ้นเวทีกันได้หลายคน)
stage_diamonds = 30
# auto = ของขวัญที่แพงสุดในตารางจับคู่ (หรือแพงกว่า) เป็นสตาร์ / ขั้น 5
star_mode = "auto"
star_diamonds = 0
tier5_auto = true


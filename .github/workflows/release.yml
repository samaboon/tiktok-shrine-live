name: build-release

# Tag pushes (v*) build all artifacts and publish a GitHub Release.
# workflow_dispatch builds and uploads the same artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (MSVC, embeds .exe icon via build.rs)
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Fetch bundled Node.js runtime
        shell: bash
        run: packaging/fetch_node.sh win dist/rt-win
      - name: Package zip
        shell: bash
        run: RUNTIME_DIR=dist/rt-win packaging/make_windows_zip.sh target/release/tiktok-shrine-live.exe
      - name: Verify bundled runtime is found
        shell: bash
        run: |
          ./dist/TikTokShrineLive/TikTokShrineLive.exe --which-node | tee which.txt
          grep -q '^bundled ' which.txt
          ls -la dist/*.zip
      - uses: actions/upload-artifact@v5
        with:
          name: TikTokShrineLive-Windows-x64
          path: |
            dist/TikTokShrineLive-Windows-x64.zip
            dist/runtime-node-win-x64.zip

  macos:
    # macos-14 image config is no longer accepted -> use the current Apple-silicon image
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal .app + .dmg + .zip
        run: packaging/macos/make_app.sh
      - name: Verify bundle
        run: |
          file "dist/TikTok Shrine Live.app/Contents/MacOS/tiktok-shrine-live"
          lipo -info "dist/TikTok Shrine Live.app/Contents/MacOS/tiktok-shrine-live"
          plutil -lint "dist/TikTok Shrine Live.app/Contents/Info.plist"
          lipo -info "dist/TikTok Shrine Live.app/Contents/MacOS/node"
          codesign -dv "dist/TikTok Shrine Live.app/Contents/MacOS/node"
          "dist/TikTok Shrine Live.app/Contents/MacOS/tiktok-shrine-live" --which-node | tee which.txt
          grep -q '^bundled ' which.txt
          ls -la dist/*.dmg dist/*.zip
      - uses: actions/upload-artifact@v5
        with:
          name: TikTokShrineLive-macOS-universal
          path: |
            dist/TikTokShrineLive-macOS-universal.dmg
            dist/TikTokShrineLive-macOS-universal.zip

  linux:
    # oldest still-supported runner -> binary needs only glibc 2.35, so it runs on older distros too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release && cargo test --release
      - name: Check glibc requirement
        run: |
          NEED=$(objdump -T target/release/tiktok-shrine-live | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "binary needs $NEED"
          ./target/release/tiktok-shrine-live --selftest
      - name: Package tar.gz (+ bundled Node.js runtime)
        run: |
          mkdir -p dist/pkg && cp target/release/tiktok-shrine-live config.toml docs/คู่มือ.md NOTICE.md dist/pkg/
          packaging/fetch_node.sh linux dist/pkg/runtime
          dist/pkg/tiktok-shrine-live --which-node | tee which.txt
          grep -q '^bundled ' which.txt
          tar -czf dist/TikTokShrineLive-Linux-x64.tar.gz -C dist/pkg .
          tar -czf dist/runtime-node-x64-glibc.tar.gz -C dist/pkg runtime
          printf '{"node":"%s"}\n' "$(cat packaging/NODE_VERSION)" > dist/runtime-version.json
          ls -la dist/*.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: TikTokShrineLive-Linux-x64
          path: |
            dist/TikTokShrineLive-Linux-x64.tar.gz
            dist/runtime-node-x64-glibc.tar.gz
            dist/runtime-version.json

  bridge:
    # Build the TikTok connector bundle (bridge.js) so the app can update only the
    # bridge ("อัปเดตตัวเชื่อม TikTok") from a release artifact, without a full app rebuild.
    # Locked dependency versions (package-lock.json) are used here; the separate
    # bridge-latest workflow refreshes tiktok-live-connector@latest on demand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build TikTok bridge bundle
        working-directory: bridge
        run: |
          npm ci --no-audit --no-fund
          npx esbuild bridge.js --bundle --platform=node --target=node18 --format=cjs --minify --outfile=dist/bridge.cjs
          node <<'NODE'
            const fs = require('fs');
            const v = require('./node_modules/tiktok-live-connector/package.json').version;
            fs.writeFileSync('dist/bridge-version.json', JSON.stringify({ connector: v }) + '\n');
            console.log(fs.readFileSync('dist/bridge-version.json', 'utf8').trim());
          NODE
          test -s dist/bridge.cjs
      - uses: actions/upload-artifact@v5
        with:
          name: bridge
          path: |
            bridge/dist/bridge.cjs
            bridge/dist/bridge-version.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux, bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/**/*.zip
            out/**/*.dmg
            out/**/*.tar.gz
            out/bridge/bridge.cjs
            out/bridge/bridge-version.json
            out/**/runtime-version.json

# ว่าง = ใช้ตาราง [gifts] ด้านบน  ("pray" / "siamsi" = ให้อาหารแมว แล้วขึ้นการ์ดขอบคุณ มีชื่อคนส่ง ไม่มีเลขมงคล)

# ---------------------------------------------------------------- อัปเดต
[update]
# ตรวจหาเวอร์ชันใหม่จาก GitHub ทุกครั้งที่เปิดโปรแกรม
check_on_start = true
repo = "samaboon/tiktok-shrine-live"
api_base = "https://api.github.com"
download_base = "https://github.com"
# release ที่เก็บตัวเชื่อม TikTok รุ่นล่าสุด (อัปเดตตัวเชื่อมได้โดยไม่ต้องรอแอปเวอร์ชันใหม่)
bridge_tag = "bridge-latest"

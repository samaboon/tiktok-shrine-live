# =============================================================
#  TikTok Shrine Live - ไฟล์ตั้งค่า (แก้แล้วปิด-เปิดโปรแกรมใหม่)
# =============================================================

[theme]
# โหมด/ธีม: "shrine" = ไหว้พระขอเลข / เสี่ยงเซียมซี,  "krathong" = ลอยกระทง,  "cat" = ให้อาหารแมว
mode = "shrine"

[tiktok]
# ชื่อผู้ใช้ TikTok ของคุณ (ไม่ต้องใส่ @) เว้นว่าง = ไม่เชื่อมต่อ TikTok (ใช้คีย์บอร์ด/HTTP ทดสอบได้)
username = ""
# เปิดตัวเชื่อม (Node.js bridge) อัตโนมัติ
enabled = true
# ขั้นสูง: ตำแหน่ง Node.js เอง ("" = อัตโนมัติ: ใช้ตัวที่มากับโปรแกรม ไม่ต้องติดตั้งอะไรเพิ่ม)
node_command = ""
bridge_script = ""
# API key ของ EulerStream (ไม่บังคับ แต่ช่วยให้เชื่อมต่อเสถียรขึ้น) https://www.eulerstream.com
sign_api_key = ""
# ถ้าหลุด รอกี่วินาทีแล้วต่อใหม่
reconnect_seconds = 15
# ของขวัญที่ไม่ได้อยู่ในตาราง [gifts] ให้ทำอะไร: "pray" | "siamsi" | "none"
default_action = "pray"
# ส่งของขวัญเป็น combo x10 ให้เล่นซ้ำสูงสุดกี่รอบ (มูลค่ารวมยังนับครบสำหรับระดับความหรูหรา)
max_plays_per_gift = 1

# ---- จับคู่ของขวัญ -> การกระทำ ----
# คีย์ได้ทั้งชื่อของขวัญ (ภาษาอังกฤษตามที่ TikTok ส่งมา ไม่สนตัวพิมพ์เล็กใหญ่) หรือ gift id (ตัวเลข) เช่น
#   "Rose" / "5655" = กุหลาบ,  "TikTok" / "5269"
# ค่าเป็น "pray" | "siamsi" | "none"  (ความหมายตามโหมด — ดู docs/คู่มือ.md ข้อ 6)
# ในหน้าตั้งค่าแท็บของขวัญมีตัวเลือกสติกเกอร์ทั้งชุด (รูป ชื่อ รหัส ราคาเพชร) ให้คลิกเลือกได้ ไม่ต้องพิมพ์เอง
# ตารางครบชุด: docs/รายการของขวัญ.md
#   "pray"   = เดินไปไหว้พระ แล้วขึ้นเลขมงคล   (โหมดกระทง = ลอยกระทงขอเลข, โหมดแมว = ให้อาหารแล้วการ์ดขอบคุณ)
#   "siamsi" = เขย่าเซียมซี                  (โหมดกระทง = อธิษฐานรับคำอวยพร, โหมดแมว = การ์ดขอบคุณเหมือนกัน)
[gifts]
"Rose" = "pray"
"5655" = "pray"          # Rose (gift id)
"TikTok" = "siamsi"
"5269" = "siamsi"        # TikTok (gift id)
"Finger Heart" = "siamsi"
"Doughnut" = "pray"
"Perfume" = "siamsi"
"Hand Hearts" = "pray"
"Galaxy" = "pray"
"Lion" = "siamsi"
"Universe" = "pray"

[http]
# เซิร์ฟเวอร์ภายในเครื่อง สำหรับทดสอบ / รับ webhook จาก TikFinity, Streamer.bot ฯลฯ
enabled = true
bind = "127.0.0.1:8787"

[window]
# ความกว้างหน้าต่าง (px) ความสูงคำนวณจากจอแนวตั้ง 9:16
width = 540
# "top" = ใช้ส่วนบนของจอ (สูง top_percent % ของจอ 9:16), "full" = เต็มจอ 9:16
layout = "top"
# 50 = ครึ่งจอบน (540 x 480)
top_percent = 50
# ตำแหน่งเริ่มต้นบนจอ (ลบออกได้)
x = 100
y = 60
# "transparent" = พื้นหลังใส (ลอยทับหน้าจอ)
# "green"       = พื้นเขียว #00FF00 สำหรับ Chroma Key
# "scene"       = วาดฉากวัดเต็มพื้นหลัง
background = "transparent"
always_on_top = true
# คลิกทะลุหน้าต่าง (กด F8 สลับ ตอนหน้าต่างโฟกัสอยู่ หรือเรียก http://127.0.0.1:8787/control?click_through=toggle)
click_through = false
# แสดงคำแนะนำการส่งของขวัญด้านล่าง
show_hint = true
hint_text = "ส่ง กุหลาบ = ไหว้พระขอเลข   |   ส่ง TikTok = เสี่ยงเซียมซี"
# แสดงสถานะการเชื่อมต่อมุมจอ
show_status = true
# ตอนว่าง (ไม่มีของขวัญ): "still" = ภาพนิ่งสวย ๆ ไม่มีตัวละคร (ค่าเริ่มต้น)
#                         "ambient" = ขยับเบา ๆ (เปลวเทียน ควันธูป กลีบดอกไม้)
#                         "hidden" = ซ่อนทั้งหมด (โปร่งใส) แล้วค่อยโผล่เมื่อมีของขวัญ
idle = "still"
# จำนวนตัวละครที่เห็นบนจอพร้อมกัน (คนที่กำลังไหว้ + คนที่ยืนต่อแถว) ที่เหลือรอนอกจอ
max_visible = 5

[numbers]
# จำนวนหลักของเลขมงคลที่จะสุ่ม (ใส่ได้หลายชุด เช่น [2, 3] หรือ [2, 3, 4])
digits = [2, 3]
title = "เลขมงคล"

[timing]
# ความเร็วการเล่น 1.0 = ปกติ, 1.5 = เร็วขึ้น
speed = 1.0
# เวลาแสดงผลเลข/คำทำนาย (วินาที)
reveal_seconds = 5.0

# ---- ระดับความหรูหรา ตามมูลค่าของขวัญ (เพชร x จำนวน) ----
# เรียงจากน้อยไปมาก, min_diamonds = เพชรขั้นต่ำของระดับนั้น
[[tiers]]
min_diamonds = 0
name = "สายบุญ"
[[tiers]]
min_diamonds = 10
name = "ผู้มีบุญ"
[[tiers]]
min_diamonds = 100
name = "เศรษฐีใจบุญ"
[[tiers]]
min_diamonds = 1000
name = "มหาเศรษฐี"
[[tiers]]
min_diamonds = 10000
name = "จักรพรรดิแห่งบุญ"


[krathong.gifts]
# ว่าง = ใช้ตาราง [gifts] ด้านบน  ("pray" = ลอยกระทงขอเลข, "siamsi" = อธิษฐานรับคำอวยพร)


# ---- โหมดให้อาหารแมว ----
[cat]
hint_text = "ส่ง กุหลาบ = ให้อาหารแมว   |   ส่ง TikTok = แมวขอบคุณ"
thanks_title = "คำขอบคุณจากแมวถึง"

  "ความรักอบอุ่นเหมือนที่นั่งในตัก",
  "การงานราบรื่น ทุกอย่างลงตัวดั่งรอยเท้าแมว",
  "พักผ่อนให้พอ แล้วพรุ่งนี้จะสดใส",
  "โชคเล็กโชคน้อยจะเดินเข้ามาหาเอง",
  "บ้านนี้มีแต่เสียงหัวเราะและความน่ารัก",
  "ขอให้สมหวังในสิ่งที่แอบอธิษฐานไว้",
  "เพื่อนฝูงน่ารัก เกื้อหนุนกันเหมือนแมวในบ้านเดียวกัน",
